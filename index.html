<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F3F4F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0D12" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Panel">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'">
<title>Panel</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<script>/* Tema elegido en Ajustes, antes de pintar para que no parpadee */ try { var t = JSON.parse(localStorage.getItem('pan_tema')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
<style>
  /* Bricolage para números y títulos; Inter para el texto (las mismas de tu app Finanzas, licencias en fonts/). Van guardadas para funcionar sin señal. */
  @font-face { font-family: "Bricolage"; src: url("fonts/bricolage.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
  @font-face { font-family: "Inter"; src: url("fonts/inter.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  /* Tema claro. Cada parte trae el color de su app: Gym morado, Finanzas menta, Comidas naranja; Panel en azul. */
  :root {
    --bg: #F3F4F8; --card: #FFFFFF; --card2: #EEF0F5; --ink: #12151E; --muted: #5D6475; --line: #E0E3EB; --sheet: #F7F8FB;
    --pri: #3D5BDB; --pri-2: #5B7BFF; --pri-weak: #E5EAFD; --on-pri: #FFFFFF;
    --gym: #6A3DE0; --gym-weak: #EFE9FD; --fin: #0D7A5E; --fin-weak: #DAF2E8; --com: #D9590F; --com-weak: #FFF0E5;
    --ok: #11804F; --ok-weak: #DFF3E8; --bad: #CF3F2A; --bad-weak: #FCE7E2; --sun: #92600A; --sun-bar: #E9A21F; --sun-weak: #FCF1D8;
    --kcal: #D9590F; --prot: #D6336C; --carb: #B57700; --gras: #0A8BB0;
    --hero-gym: linear-gradient(145deg, #3B1E8F 0%, #6A3DE0 58%, #8B5CF6 100%); --glow-gym: rgba(106, 61, 224, .28);
    --hero-fin: linear-gradient(145deg, #093F33 0%, #0D7A5E 58%, #0E8462 100%); --glow-fin: rgba(13, 122, 94, .26);
    --nav-bg: rgba(255, 255, 255, .86); --glow: rgba(61, 91, 219, .28);
    --shadow: 0 1px 2px rgba(20, 30, 60, .05), 0 8px 24px rgba(20, 30, 60, .06);
    --nav-h: 66px; --disp: "Bricolage", Inter, -apple-system, "Segoe UI", Roboto, sans-serif; --txt: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    --sat: max(env(safe-area-inset-top), var(--safe-area-inset-top, 0px));
    --sab: max(env(safe-area-inset-bottom), var(--safe-area-inset-bottom, 0px));
    color-scheme: light;
  }
  /* Tema oscuro (automático o elegido en Ajustes) */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0D12; --card: #141820; --card2: #1B2029; --ink: #EDF0F7; --muted: #98A0B3; --line: #262C38; --sheet: #10141B;
      --pri: #7C9BFF; --pri-2: #A5B9FF; --pri-weak: #1C2647; --on-pri: #0A0F22;
      --gym: #A58BFF; --gym-weak: #2A2142; --fin: #3DDC97; --fin-weak: #10302A; --com: #FF9A55; --com-weak: #35231A;
      --ok: #4BE39B; --ok-weak: #13291C; --bad: #FF7A66; --bad-weak: #3A1A14; --sun: #FFC857; --sun-bar: #F4BF55; --sun-weak: #33280F;
      --kcal: #FF9A55; --prot: #FF6B9A; --carb: #F4BF55; --gras: #22C3E6;
      --hero-gym: linear-gradient(145deg, #24125E 0%, #5B2FD0 58%, #7C5CFF 100%); --glow-gym: rgba(124, 92, 255, .22);
      --hero-fin: linear-gradient(145deg, #0A332A 0%, #0F6A51 58%, #0E8462 100%); --glow-fin: rgba(61, 220, 151, .14);
      --nav-bg: rgba(20, 24, 32, .84); --glow: rgba(124, 155, 255, .22);
      --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 28px rgba(0, 0, 0, .35);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0D12; --card: #141820; --card2: #1B2029; --ink: #EDF0F7; --muted: #98A0B3; --line: #262C38; --sheet: #10141B;
    --pri: #7C9BFF; --pri-2: #A5B9FF; --pri-weak: #1C2647; --on-pri: #0A0F22;
    --gym: #A58BFF; --gym-weak: #2A2142; --fin: #3DDC97; --fin-weak: #10302A; --com: #FF9A55; --com-weak: #35231A;
    --ok: #4BE39B; --ok-weak: #13291C; --bad: #FF7A66; --bad-weak: #3A1A14; --sun: #FFC857; --sun-bar: #F4BF55; --sun-weak: #33280F;
    --kcal: #FF9A55; --prot: #FF6B9A; --carb: #F4BF55; --gras: #22C3E6;
    --hero-gym: linear-gradient(145deg, #24125E 0%, #5B2FD0 58%, #7C5CFF 100%); --glow-gym: rgba(124, 92, 255, .22);
    --hero-fin: linear-gradient(145deg, #0A332A 0%, #0F6A51 58%, #0E8462 100%); --glow-fin: rgba(61, 220, 151, .14);
    --nav-bg: rgba(20, 24, 32, .84); --glow: rgba(124, 155, 255, .22);
    --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 10px 28px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font: 16px/1.42 var(--txt); font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; overscroll-behavior-y: contain; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--pri); outline-offset: 2px; }
  .hide { display: none !important; }
  .num { font-variant-numeric: tabular-nums; }

  /* Barra superior translúcida (llega hasta arriba, debajo de la cámara) */
  .appbar { position: sticky; top: 0; z-index: 25; padding: calc(var(--sat) + 8px) 16px 8px;
            background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px); }
  .appbar .in { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .appbar h1 { font: 750 24px/1.1 var(--disp); letter-spacing: -.03em; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sync { font-size: 12.5px; min-height: 36px; padding: 6px 12px; border-radius: 99px; background: var(--card2); color: var(--muted); white-space: nowrap; border: 1px solid var(--line); font-weight: 650; }
  .sync.pend { background: var(--sun-weak); color: var(--sun); border-color: transparent; }
  .sync.ok { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
  .iconbtn { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: grid; place-items: center; flex: none; }
  .iconbtn svg { width: 21px; height: 21px; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 2px 16px calc(var(--nav-h) + 52px + var(--sab)); }
  #view.anima > * { animation: sube .22s cubic-bezier(.2, .8, .2, 1); }
  @keyframes sube { from { transform: translateY(6px); } }

  /* Textos y tarjetas */
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .card.flat { box-shadow: none; background: var(--card2); }
  .row { display: flex; align-items: center; gap: 10px; }
  .between { justify-content: space-between; }
  .muted { color: var(--muted); font-size: 13.5px; }
  .small { font-size: 12.5px; }
  .t1 { font-weight: 700; font-size: 16px; }
  .amt { font: 720 22px/1.15 var(--disp); letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
  .red { color: var(--bad); } .green { color: var(--ok); } .amber { color: var(--sun); }
  h2 { font: 750 12.5px/1.2 var(--txt); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin: 26px 4px 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  h2 .tag { text-transform: none; letter-spacing: 0; }
  .tag { display: inline-flex; align-items: center; gap: 5px; font: 650 12px/1.2 var(--txt); padding: 5px 9px; border-radius: 99px; background: var(--card2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
  .tag.ej { background: var(--sun-weak); color: var(--sun); border-color: transparent; }
  .tag.ok { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
  .tag.err { background: var(--bad-weak); color: var(--bad); border-color: transparent; }
  button.tag { min-height: 32px; }
  .note { font-size: 14px; padding: 12px 14px; border-radius: 16px; background: var(--sun-weak); color: var(--sun); margin-bottom: 12px; line-height: 1.4; }
  .note.info { background: var(--pri-weak); color: var(--pri); }
  .note.red { background: var(--bad-weak); color: var(--bad); }
  .note b { font-weight: 700; }
  .empty { text-align: center; color: var(--muted); padding: 18px 12px; font-size: 14.5px; }

  /* Saludo */
  .saludo { margin: 4px 4px 14px; }
  .saludo .fecha { color: var(--muted); font-size: 14px; }
  .saludo .hola { font: 750 26px/1.15 var(--disp); letter-spacing: -.03em; }

  /* Botones rápidos */
  .rapidos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 4px; }
  .rapido { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 78px; padding: 10px 4px; border-radius: 18px;
            background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; font-size: 12.5px; font-weight: 650; text-align: center; line-height: 1.2; }
  .rapido:active { transform: scale(.97); }
  .rapido .ic { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; font-size: 19px; color: #fff; }
  .rapido .ic svg { width: 21px; height: 21px; }
  .ic.gym { background: linear-gradient(135deg, #5B2FD0, #8B5CF6); }
  .ic.fin { background: linear-gradient(135deg, #0A6B52, #14A37A); }
  .ic.gasto { background: linear-gradient(135deg, #B4381F, #E8633F); }
  .ic.com { background: linear-gradient(135deg, #C24E0C, #F28C3C); }

  /* Héroes con degradado */
  .hero { position: relative; overflow: hidden; margin: 0 0 12px; padding: 16px 18px; border-radius: 26px; color: #fff; isolation: isolate; }
  .hero.gym { background: var(--hero-gym); box-shadow: 0 16px 36px var(--glow-gym); }
  .hero.fin { background: var(--hero-fin); box-shadow: 0 16px 36px var(--glow-fin); }
  .hero::before { content: ""; position: absolute; z-index: -1; width: 260px; height: 260px; right: -90px; top: -120px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, .14), transparent); }
  .hero .lbl { color: rgba(255, 255, 255, .82); font-size: 14.5px; }
  .hero .big { font: 780 44px/1.05 var(--disp); letter-spacing: -.04em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
  .hero .big small { font: 600 16px/1.2 var(--txt); letter-spacing: 0; opacity: .85; margin-left: 6px; }
  .hero .of { color: rgba(255, 255, 255, .84); font-size: 14px; }
  .hero .of b { color: #fff; }
  .hero .pie { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .hero .btnh { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; min-height: 44px; border-radius: 14px; background: rgba(255, 255, 255, .18); color: #fff;
                text-decoration: none; font-weight: 700; font-size: 14.5px; border: 0; }
  .rot { display: flex; gap: 6px; }
  .rot span { padding: 5px 10px; border-radius: 99px; font-size: 12.5px; font-weight: 700; background: rgba(255, 255, 255, .14); color: rgba(255, 255, 255, .8); }
  .rot span.on { background: #fff; color: #3B1E8F; }
  .rot span.hecho { text-decoration: line-through; opacity: .7; }

  /* Datos en cuadrícula */
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 13px 14px; min-width: 0; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .stat .muted { font-size: 12.5px; }
  .stat .v { font: 760 26px/1.1 var(--disp); letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .v small { font: 600 13px/1 var(--txt); color: var(--muted); letter-spacing: 0; margin-left: 3px; }
  .stat .d { font-size: 12.5px; font-weight: 650; margin-top: 3px; color: var(--muted); }
  .stat .d.bien { color: var(--ok); } .stat .d.mal { color: var(--bad); }
  .stat svg.spark { width: 100%; height: 34px; margin-top: auto; padding-top: 6px; display: block; overflow: visible; }
  .semdots { display: flex; justify-content: space-between; gap: 3px; margin-top: auto; padding-top: 8px; }
  .semdots div { flex: 1; text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 650; }
  .semdots i { display: block; height: 18px; border-radius: 6px; margin-bottom: 3px; background: var(--card2); border: 1.5px solid var(--line); }
  .semdots .si i { background: var(--gym); border-color: var(--gym); }
  .semdots .hoy { color: var(--ink); }
  .semdots .hoy i { border-color: var(--gym); }
  .barritas { display: flex; align-items: flex-end; gap: 4px; height: 34px; margin-top: auto; padding-top: 6px; }
  .barritas i { flex: 1; border-radius: 4px; background: var(--line); min-height: 3px; }
  .barritas i.act { background: var(--gym); }

  /* Cuenta regresiva */
  .carrera { display: flex; align-items: center; gap: 14px; }
  .carrera .dias { flex: none; width: 84px; height: 84px; border-radius: 24px; display: grid; place-items: center; text-align: center; background: var(--gym-weak); color: var(--gym); }
  .carrera .dias b { display: block; font: 800 34px/1 var(--disp); letter-spacing: -.04em; }
  .carrera .dias span { font-size: 12px; font-weight: 700; }
  .carrera .tx { flex: 1; min-width: 0; }
  .pasos { display: flex; gap: 4px; margin-top: 10px; }
  .pasos i { flex: 1; height: 6px; border-radius: 9px; background: var(--card2); }
  .pasos i.ya { background: var(--gym); }

  /* Barras de avance */
  .meter { height: 10px; background: var(--card2); border-radius: 99px; overflow: hidden; margin: 10px 0 7px; position: relative; }
  .meter > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--fin), color-mix(in srgb, var(--fin) 70%, #fff)); transition: width .5s cubic-bezier(.2, .8, .2, 1); }
  .meter > div.warn { background: var(--sun-bar); }
  .meter > div.over { background: var(--bad); }
  .meter .marca { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .35; border-radius: 2px; }
  .hero .meter { background: rgba(255, 255, 255, .2); }
  .hero .meter > div { background: #fff; }
  .legend { display: flex; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--muted); }

  /* Listas (cuentas, categorías, personas, comidas) */
  .list { background: var(--card); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: var(--shadow); margin-bottom: 12px; }
  .list .sub { padding: 12px 16px 4px; font-size: 12px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; justify-content: space-between; }
  .it { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--line); min-height: 60px; width: 100%; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; }
  .list > .it:first-child, .list > .sub + .it { border-top: 0; }
  .it .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 18px; flex: none; background: var(--card2); }
  .it .tx { flex: 1; min-width: 0; }
  .it .d1 { font-weight: 650; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .d2 { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it .m { font: 680 16px/1.2 var(--disp); font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
  .it .m small { display: block; font: 500 11.5px/1.2 var(--txt); color: var(--muted); }
  .it .x { width: 40px; height: 40px; border-radius: 12px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; flex: none; margin-right: -8px; }
  .it .x svg { width: 18px; height: 18px; }
  button.it:active { background: var(--card2); }
  .cat { padding: 12px 16px; border-top: 1px solid var(--line); }
  .cat:first-child { border-top: 0; }
  .cat .top2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14.5px; }
  .cat .nm { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .cat .meter { height: 7px; margin: 7px 0 0; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .cols .t { font-size: 12.5px; color: var(--muted); font-weight: 650; }
  .cols .amt { margin: 2px 0 8px; }
  .qrow { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 5px 0; border-top: 1px solid var(--line); }
  .qrow span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .qrow b { white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Botones */
  .btn { border: 0; border-radius: 15px; padding: 13px 16px; font-weight: 700; font-size: 16px; background: linear-gradient(135deg, var(--pri), var(--pri-2)); color: var(--on-pri); min-height: 48px; box-shadow: 0 6px 16px var(--glow); }
  .btn.ghost { background: var(--card2); color: var(--ink); border: 1px solid var(--line); font-weight: 600; box-shadow: none; }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid var(--bad); font-weight: 600; box-shadow: none; }
  .btn.com { background: linear-gradient(135deg, #D9590F, #F28C3C); color: #fff; box-shadow: 0 6px 16px rgba(217, 89, 15, .25); }
  .btn.sm { padding: 9px 13px; font-size: 14.5px; border-radius: 12px; min-height: 44px; }
  .btn.block { width: 100%; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .btns .btn { flex: 1; }
  .link { background: none; border: 0; color: var(--pri); font-weight: 700; font-size: 14px; padding: 10px 2px; min-height: 44px; }

  /* Segmentos y chips */
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card2); border: 1px solid var(--line); border-radius: 16px; padding: 4px; gap: 4px; margin-bottom: 12px; }
  .seg button { border: 0; background: none; border-radius: 12px; padding: 9px 2px; min-height: 42px; font-weight: 650; font-size: 14px; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
  .pick { display: flex; flex-wrap: wrap; gap: 7px; }
  .pick button { border: 1px solid var(--line); background: var(--card); border-radius: 13px; padding: 9px 12px; min-height: 44px; font-size: 14.5px; font-weight: 600; }
  .pick button.on { border-color: var(--com); background: var(--com-weak); color: var(--com); box-shadow: inset 0 0 0 1px var(--com); }
  .quick { display: flex; gap: 7px; overflow-x: auto; padding: 2px 16px 6px; margin: 0 -16px 6px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex: none; border: 1.5px dashed var(--com); background: var(--card); color: var(--com); border-radius: 13px; padding: 8px 12px; min-height: 44px; font-size: 14px; font-weight: 650; }

  /* Comidas: anillo de calorías y barras de macros */
  .macros { display: flex; gap: 16px; align-items: center; }
  .anillo { position: relative; width: 132px; height: 132px; flex: none; }
  .anillo svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .anillo .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .anillo b { display: block; font: 800 28px/1 var(--disp); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
